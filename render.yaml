# Pakistan CRM OS — Render.com Infrastructure as Code
# Deploy: dashboard.render.com → New → Blueprint → connect repo → this file auto-detected
# All services use the FREE plan (web services sleep after 15min inactivity)
# PostgreSQL free plan: 256MB, expires 90 days — upgrade to Starter ($7/mo) for production
# Redis free plan: 25MB, expires 30 days — upgrade to Starter ($10/mo) for production

services:
  # ── 1. Node.js API Gateway ────────────────────────────────────────────────
  - type: web
    name: crm-gateway
    runtime: node
    plan: free
    region: singapore               # Nearest to Pakistan
    rootDir: backend/gateway
    buildCommand: npm install --production
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SERVICE_NAME
        value: crm-gateway
      - key: SERVICE_VERSION
        value: "1.0.0"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: crm-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: crm-production
      - key: JWT_AUDIENCE
        value: crm-api
      - key: SKIP_JWT_VERIFICATION
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://crm-frontend-0gde.onrender.com,https://crm-frontend.onrender.com,https://yourcrm.pk
      - key: JAZZCASH_STUB_MODE
        value: "true"
      - key: EASYPAISA_STUB_MODE
        value: "true"

  # ── 2. Python Services Layer ──────────────────────────────────────────────
  - type: web
    name: crm-services
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: PORT
        value: "10000"
      - key: SERVICE_NAME
        value: crm-services

  # ── 3. Frontend Static Site ───────────────────────────────────────────────
  - type: web
    name: crm-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend/src
    buildCommand: echo "static site — no build needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

databases:
  # ── 4. PostgreSQL ─────────────────────────────────────────────────────────
  - name: crm-postgres
    databaseName: crm_production
    user: crm
    plan: free
    region: singapore
    ipAllowList: []               # Allow all (gateway is on Render internal network)

  # ── 5. Redis ──────────────────────────────────────────────────────────────
  - name: crm-redis
    plan: free
    region: singapore
    ipAllowList: []
