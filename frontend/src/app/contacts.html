<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pakistan CRM — Contact List</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link rel="stylesheet" href="assets/libs/datatables/datatables.min.css">
  <link rel="stylesheet" href="assets/libs/flatpickr/flatpickr.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
  <div class="page-layout">
    <!-- header + sidebar injected by crm-shell.js -->
    <main class="app-wrapper">

      <div class="container-fluid">

        <div class="app-page-head d-flex align-items-center justify-content-between">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">Contacts</li>
            </ol>
          </nav>
          <button type="button" class="btn btn-primary btn-sm waves-effect">
            <i class="fi fi-rr-user-add me-1"></i> New Contact
          </button>
        </div>

        <!-- KPI Summary Cards -->
        <div class="row">

          <div class="col-xxl-3 col-md-6">
            <div class="card card-action action-border-primary">
              <div class="card-header border-0 pb-0">
                <div class="avatar bg-primary-subtle text-primary rounded-3">
                  <i class="fi fi-rr-users"></i>
                </div>
              </div>
              <div class="card-body">
                <h6>Total Contacts</h6>
                <h2 class="mb-1" id="kpi-total-contacts">1,248</h2>
                <p class="mb-0"><span class="text-success" id="kpi-contacts-new-month">—</span> this month</p>
              </div>
            </div>
          </div>

          <div class="col-xxl-3 col-md-6">
            <div class="card card-action action-border-success">
              <div class="card-header border-0 pb-0">
                <div class="avatar bg-success-subtle text-success rounded-3">
                  <i class="fi fi-brands-whatsapp"></i>
                </div>
              </div>
              <div class="card-body">
                <h6>Active via WhatsApp</h6>
                <h2 class="mb-1" id="kpi-whatsapp-active">843</h2>
                <p class="mb-0 text-muted"><span id="kpi-whatsapp-pct">—</span>% of contacts</p>
              </div>
            </div>
          </div>

          <div class="col-xxl-3 col-md-6">
            <div class="card card-action action-border-warning">
              <div class="card-header border-0 pb-0">
                <div class="avatar bg-warning-subtle text-warning rounded-3">
                  <i class="fi fi-rr-shield-exclamation"></i>
                </div>
              </div>
              <div class="card-body">
                <h6>Open Cases</h6>
                <h2 class="mb-1" id="kpi-open-cases">47</h2>
                <p class="mb-0 text-muted">Across <span id="kpi-cases-contact-count">—</span> contacts</p>
              </div>
            </div>
          </div>

          <div class="col-xxl-3 col-md-6">
            <div class="card card-action action-border-info">
              <div class="card-header border-0 pb-0">
                <div class="avatar bg-info-subtle text-info rounded-3">
                  <i class="fi fi-rr-clock"></i>
                </div>
              </div>
              <div class="card-body">
                <h6>Idle &gt; 7 Days</h6>
                <h2 class="mb-1 text-warning" id="kpi-idle-7d">18</h2>
                <p class="mb-0 text-muted">No touchpoint in 7d+</p>
              </div>
            </div>
          </div>

        </div>

        <!-- Contact List DataTable -->
        <div class="row">
          <div class="col-xxl-12">
            <div class="card">

              <div class="card-header d-flex align-items-center justify-content-between">
                <h6 class="card-title mb-0">Contact List</h6>
                <div id="dt_Contacts_Search"></div>
              </div>

              <!-- Filter chips -->
              <div class="px-3 py-2 border-bottom d-flex flex-wrap align-items-center gap-2">
                <span class="text-muted small me-1">Filter:</span>
                <button type="button" class="btn btn-sm btn-outline-warning" id="contact-filter-open-case">
                  <i class="fi fi-rr-shield-exclamation me-1"></i>Has Open Case
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="contact-filter-idle">
                  <i class="fi fi-rr-clock me-1"></i>Idle &gt; 1 Day
                </button>
                <div class="vr mx-1"></div>
                <span class="text-muted small me-1">Tag:</span>
                <ul class="nav nav-pills nav-pills-custom p-1 bg-light rounded-5" id="contact-filter-tag" role="tablist">
                  <li class="nav-item"><button type="button" class="nav-link rounded-5 active" data-filter="">All</button></li>
                  <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="Lead">Lead</button></li>
                  <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="Customer">Customer</button></li>
                  <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="VIP">VIP</button></li>
                </ul>
              </div>

              <div class="card-body px-1 pt-2 pb-2">
                <div class="table-responsive">
                  <table id="dt_Contacts" class="table table-sm display table-row-rounded data-row-checkbox">
                    <thead class="table-light">
                      <tr>
                        <th class="dt-head-center">Name</th>
                        <th class="dt-head-center">Phone</th>
                        <th class="dt-head-center">Account</th>
                        <th class="dt-head-center">Last Touchpoint</th>
                        <th class="dt-head-center">Open Cases</th>
                        <th class="dt-head-center">Tags</th>
                        <th class="dt-head-center">Action</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>

            </div>
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- ── Script block ─────────────────────────────────────────────────── -->
  <script src="assets/libs/global/global.min.js"></script>
  <script src="assets/js/app/crm-dummy.js"></script>
  <script src="assets/js/app/crm-api.js"></script>
  <script>window.CRM_PAGE = 'contacts';</script>
  <script src="assets/js/app/crm-shell.js"></script>
  <script src="assets/js/app/crm-components.js"></script>
  <script src="assets/js/appSettings.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/libs/datatables/datatables.min.js"></script>
  <script src="assets/js/app/crm-contacts.js"></script>
  <script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
