<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Queue — NexLink CRM</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link rel="stylesheet" href="assets/libs/datatables/datatables.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
<div class="page-layout">
  <main class="app-wrapper">
    <div class="container-fluid">

      <div class="app-page-head d-flex align-items-center justify-content-between mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
            <li class="breadcrumb-item active">Cases</li>
          </ol>
        </nav>
        <div class="d-flex gap-2">
          <a href="app/case-new.html" class="btn btn-sm btn-primary">
            <i class="fi fi-rr-plus me-1"></i>New Case
          </a>
          <a href="app/support-console.html" class="btn btn-sm btn-outline-secondary">
            <i class="fi fi-rr-headset me-1"></i>Support Console
          </a>
        </div>
      </div>

      <!-- KPI Strip -->
      <div class="row g-3 mb-3">
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body py-3">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-primary-subtle"><i class="fi fi-rr-ticket text-primary"></i></div>
                <div><h6 class="mb-0 text-muted small">Open Cases</h6><h3 class="mb-0 fw-bold" id="kpi-open">—</h3></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body py-3">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-danger-subtle"><i class="fi fi-rr-exclamation text-danger"></i></div>
                <div><h6 class="mb-0 text-muted small">SLA Breached</h6><h3 class="mb-0 fw-bold" id="kpi-breached">—</h3></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body py-3">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-warning-subtle"><i class="fi fi-rr-alarm-clock text-warning"></i></div>
                <div><h6 class="mb-0 text-muted small">At Risk</h6><h3 class="mb-0 fw-bold" id="kpi-atrisk">—</h3></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body py-3">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-success-subtle"><i class="fi fi-rr-check-circle text-success"></i></div>
                <div><h6 class="mb-0 text-muted small">Resolved</h6><h3 class="mb-0 fw-bold" id="kpi-resolved">—</h3></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Filter chips + Table -->
      <div class="card" style="height:auto">
        <div class="card-header d-flex flex-wrap align-items-center gap-3">
          <ul class="nav nav-pills nav-pills-custom p-1 bg-light rounded-5 mb-0" id="filter-status" role="tablist">
            <li class="nav-item"><button type="button" class="nav-link rounded-5 active" data-filter="">All</button></li>
            <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="OPEN">Open</button></li>
            <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="IN_PROGRESS">In Progress</button></li>
            <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="ESCALATED">Escalated</button></li>
            <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="RESOLVED">Resolved</button></li>
          </ul>
          <ul class="nav nav-pills nav-pills-custom p-1 bg-light rounded-5 mb-0" id="filter-sla" role="tablist">
            <li class="nav-item"><button type="button" class="nav-link rounded-5 active" data-sla="">All SLA</button></li>
            <li class="nav-item"><button type="button" class="nav-link rounded-5" data-sla="breached">Breached</button></li>
            <li class="nav-item"><button type="button" class="nav-link rounded-5" data-sla="at_risk">At Risk</button></li>
            <li class="nav-item"><button type="button" class="nav-link rounded-5" data-sla="healthy">Healthy</button></li>
          </ul>
        </div>
        <div class="card-body p-0">
          <table id="dt_Cases" class="table table-hover mb-0 w-100">
            <thead>
              <tr>
                <th class="dt-head-center">Case #</th>
                <th class="dt-head-center">Subject</th>
                <th class="dt-head-center">Contact</th>
                <th class="dt-head-center">Priority</th>
                <th class="dt-head-center">Status</th>
                <th class="dt-head-center">SLA</th>
                <th class="dt-head-center">Queue</th>
                <th class="dt-head-center">Response Due</th>
                <th class="dt-head-center">Action</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/libs/global/global.min.js"></script>
<script src="assets/js/app/crm-dummy.js"></script>
<script src="assets/js/app/crm-api.js"></script>
<script>window.CRM_PAGE = 'cases';</script>
<script src="assets/js/app/crm-shell.js"></script>
<script src="assets/js/app/crm-components.js"></script>
<script src="assets/js/appSettings.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/libs/datatables/datatables.min.js"></script>
<script src="assets/js/app/crm-cases.js"></script>
<script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
