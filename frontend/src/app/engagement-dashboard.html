<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Communication Engagement Dashboard — NexLink CRM</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
<div class="page-layout">
  <main class="app-wrapper">
    <div class="container-fluid">

      <div class="app-page-head d-flex align-items-center justify-content-between mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
            <li class="breadcrumb-item active">Engagement Dashboard</li>
          </ol>
        </nav>
        <span class="badge bg-warning-subtle text-warning border border-warning-subtle">Cat 2 — Dummy Mode</span>
      </div>

      <!-- ZONE 2: Primary KPI Tiles -->
      <div class="row g-3 mb-3">
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-success-subtle">
                  <i class="fi fi-rr-paper-plane text-success"></i>
                </div>
                <div>
                  <h6 class="mb-0 text-muted small">Delivery Rate</h6>
                  <h2 class="mb-0 fw-bold" id="kpi-delivery">—</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-primary-subtle">
                  <i class="fi fi-rr-eye text-primary"></i>
                </div>
                <div>
                  <h6 class="mb-0 text-muted small">Open Rate</h6>
                  <h2 class="mb-0 fw-bold" id="kpi-open">—</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-info-subtle">
                  <i class="fi fi-rr-comment text-info"></i>
                </div>
                <div>
                  <h6 class="mb-0 text-muted small">Reply Rate</h6>
                  <h2 class="mb-0 fw-bold" id="kpi-reply">—</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-danger-subtle">
                  <i class="fi fi-rr-cross-circle text-danger"></i>
                </div>
                <div>
                  <h6 class="mb-0 text-muted small">Failed Deliveries</h6>
                  <h2 class="mb-0 fw-bold" id="kpi-failed">—</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ZONE 3: Campaign Queue + Engagement Chart -->
      <div class="row g-3 mb-3">
        <div class="col-lg-5">
          <div class="card" style="height:auto">
            <div class="card-header d-flex align-items-center justify-content-between">
              <h6 class="mb-0">Active Campaigns</h6>
              <a href="app/marketing-workspace.html" class="btn btn-sm btn-outline-primary">All Campaigns</a>
            </div>
            <div class="card-body p-0">
              <div class="list-group list-group-flush" id="campaign-queue"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card" style="height:auto">
            <div class="card-header">
              <h6 class="mb-0">Channel Engagement Rates</h6>
            </div>
            <div class="card-body">
              <div id="chart-engagement"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- WhatsApp stats strip -->
      <div class="row g-3 mb-3">
        <div class="col-12">
          <div class="card" style="height:auto">
            <div class="card-body py-3">
              <div class="d-flex flex-wrap gap-4 align-items-center">
                <div class="d-flex align-items-center gap-2">
                  <i class="fi fi-brands-whatsapp text-success fs-5"></i>
                  <span class="small text-muted">WhatsApp Opted-in:</span>
                  <span class="fw-semibold" id="wa-opted-in">—</span>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <i class="fi fi-rr-user-remove text-danger fs-5"></i>
                  <span class="small text-muted">Opt-out Rate:</span>
                  <span class="fw-semibold" id="wa-opt-out">—</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/libs/global/global.min.js"></script>
<script src="assets/js/app/crm-dummy.js"></script>
<script src="assets/js/app/crm-api.js"></script>
<script>window.CRM_PAGE = 'engagement-dashboard';</script>
<script src="assets/js/app/crm-shell.js"></script>
<script src="assets/js/app/crm-components.js"></script>
<script src="assets/js/appSettings.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/libs/apexcharts/apexcharts.min.js"></script>
<script src="assets/js/app/crm-engagement-dashboard.js"></script>
<script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
