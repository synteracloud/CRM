<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Article — NexLink CRM</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
<div class="page-layout">
  <main class="app-wrapper">
    <div class="container-fluid">

      <div class="app-page-head d-flex align-items-center justify-content-between mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
            <li class="breadcrumb-item"><a href="app/knowledge-dashboard.html">Knowledge</a></li>
            <li class="breadcrumb-item active" id="bc-article-title">Article</li>
          </ol>
        </nav>
        <span class="badge bg-warning-subtle text-warning border border-warning-subtle">Cat 2 — Dummy Mode</span>
      </div>

      <!-- Identity Strip -->
      <div class="row mb-3">
        <div class="col-12">
          <div class="card mb-0" style="height:auto">
            <div class="card-body">
              <div class="d-flex flex-wrap align-items-center gap-3">
                <div class="flex-grow-1">
                  <div class="d-flex align-items-center gap-2 mb-1">
                    <h5 class="mb-0 fw-bold" id="article-title">—</h5>
                    <span id="status-badge"></span>
                    <span id="category-badge"></span>
                    <span id="stale-badge"></span>
                  </div>
                  <div class="d-flex gap-3 small text-muted">
                    <span><i class="fi fi-rr-user me-1"></i>Author: <span id="article-author">—</span></span>
                    <span><i class="fi fi-rr-calendar me-1"></i>Updated: <span id="article-updated">—</span></span>
                  </div>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-sm btn-outline-secondary" id="btn-edit">Edit</button>
                  <button class="btn btn-sm btn-primary" id="btn-publish">Publish</button>
                  <button class="btn btn-sm btn-outline-danger" id="btn-archive">Archive</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Split Pane -->
      <div class="row g-3">
        <div class="col-lg-8">
          <div class="card" style="height:auto">
            <div class="card-header">
              <ul class="nav nav-tabs card-header-tabs">
                <li class="nav-item"><a class="nav-link active" href="#tab-content" data-bs-toggle="tab">Content</a></li>
                <li class="nav-item"><a class="nav-link" href="#tab-versions" data-bs-toggle="tab">Version History</a></li>
                <li class="nav-item"><a class="nav-link" href="#tab-related" data-bs-toggle="tab">Related Articles</a></li>
                <li class="nav-item"><a class="nav-link" href="#tab-feedback" data-bs-toggle="tab">Feedback</a></li>
              </ul>
            </div>
            <div class="card-body tab-content">
              <div class="tab-pane fade show active" id="tab-content">
                <div id="article-content"></div>
              </div>
              <div class="tab-pane fade" id="tab-versions">
                <div id="version-history"></div>
              </div>
              <div class="tab-pane fade" id="tab-related">
                <div id="related-articles"></div>
              </div>
              <div class="tab-pane fade" id="tab-feedback">
                <div class="text-muted small py-3 text-center">No feedback submitted yet.</div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card mb-3" style="height:auto">
            <div class="card-header"><h6 class="mb-0">Article Stats</h6></div>
            <div class="card-body" id="context-stats"></div>
          </div>
          <div class="card" style="height:auto">
            <div class="card-header"><h6 class="mb-0">Case Deflection</h6></div>
            <div class="card-body" id="context-deflection"></div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/libs/global/global.min.js"></script>
<script src="assets/js/app/crm-dummy.js"></script>
<script src="assets/js/app/crm-api.js"></script>
<script>window.CRM_PAGE = 'knowledge-article';</script>
<script src="assets/js/app/crm-shell.js"></script>
<script src="assets/js/app/crm-components.js"></script>
<script src="assets/js/appSettings.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/app/crm-knowledge-article.js"></script>
<script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
