<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexLink | CRM Admin Dashboard Template</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link rel="stylesheet" href="assets/libs/flatpickr/flatpickr.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div class="page-layout">
    <!-- header + sidebar injected by crm-shell.js -->
    <main class="app-wrapper">
      <div class="container-fluid">

        <div class="app-page-head">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="app/dashboard.html">
                  <i class="fi fi-rr-home"></i> Home
                </a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">Apexchart</li>
            </ol>
          </nav>
        </div>

        <div class="row">

          <div class="col-lg-6">
            <div class="card">
              <div class="card-header border-0 pb-0">
                <h6 class="card-title">Employee Structure</h6>
              </div>
              <div class="card-body p-2">
                <div id="chartEmployee"></div>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="card">
              <div class="card-header border-0 pb-0">
                <h6 class="card-title">Attendance Rate</h6>
              </div>
              <div class="card-body p-2">
                <div id="chartAttendanceRate"></div>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="card">
              <div class="card-header border-0 pb-0">
                <h6 class="card-title">Payroll Summary</h6>
              </div>
              <div class="card-body p-2">
                <div id="chartPayrollSummary"></div>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="card">
              <div class="card-header border-0 pb-0">
                <h6 class="card-title">Average Team KPI</h6>
              </div>
              <div class="card-body p-2">
                <div id="averageTeamKPI"></div>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="card">
              <div class="card-header border-0 pb-0">
                <h6 class="card-title">Daily Sales States</h6>
              </div>
              <div class="card-body p-2 pb-0">
                <div id="chartDailySalesStates"></div>
              </div>
            </div>
          </div>

          <div class="col-lg-6">
            <div class="card">
              <div class="card-header border-0 pb-0">
                <h6 class="card-title">Stocks Prices</h6>
              </div>
              <div class="card-body p-2 pb-0">
                <div id="chartStocksPrices"></div>
              </div>
            </div>
          </div>

        </div>

      </div>
    </main>
  </div>
  <script src="assets/libs/global/global.min.js"></script>
  <script src="assets/js/app/crm-dummy.js"></script>
  <script src="assets/js/app/crm-api.js"></script>
  <script src="assets/js/app/crm-shell.js"></script>
  <script src="assets/js/app/crm-components.js"></script>
  <script src="assets/js/appSettings.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/libs/flatpickr/flatpickr.min.js"></script>
  <script src="assets/libs/apexcharts/apexcharts.min.js"></script>
  <script src="assets/js/chart/apexchart.js"></script>
</body>
</html>
