<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Object Layout Builder — NexLink CRM</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
<div class="page-layout">
  <main class="app-wrapper">
    <div class="container-fluid">

      <div class="app-page-head d-flex align-items-center justify-content-between mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
            <li class="breadcrumb-item active">Object Layout Builder</li>
          </ol>
        </nav>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary">Preview Layout</button>
          <button class="btn btn-sm btn-primary" disabled title="Dummy mode">Save Layout</button>
          <span class="badge bg-warning-subtle text-warning border border-warning-subtle">Cat 2 — Dummy Mode</span>
        </div>
      </div>

      <!-- Object Selector -->
      <div class="card mb-3" style="height:auto">
        <div class="card-body py-2">
          <div class="row g-2 align-items-center">
            <div class="col-md-3">
              <label class="form-label small mb-0 fw-semibold">Object Type</label>
              <select class="form-select form-select-sm" id="object-type">
                <option value="lead" selected>Lead</option>
                <option value="contact">Contact</option>
                <option value="opportunity">Opportunity</option>
                <option value="account">Account</option>
                <option value="custom_project">Custom: Project</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label small mb-0 fw-semibold">Fields</label>
              <div class="form-control form-control-sm bg-light" id="field-count">14 fields</div>
            </div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <!-- Field Registry -->
        <div class="col-lg-3">
          <div class="card" style="height:auto">
            <div class="card-header d-flex align-items-center justify-content-between py-2">
              <h6 class="mb-0 small">Available Fields</h6>
              <button class="btn btn-xs btn-outline-primary" disabled title="Dummy mode"><i class="fi fi-rr-plus me-1"></i>Add Field</button>
            </div>
            <div class="card-body p-0" id="field-list"></div>
          </div>
        </div>

        <!-- Layout Canvas -->
        <div class="col-lg-6">
          <div class="card" style="height:auto">
            <div class="card-header py-2">
              <h6 class="mb-0 small">Layout Canvas <span class="small text-muted fw-normal">(drag fields here to arrange)</span></h6>
            </div>
            <div class="card-body">
              <div class="alert alert-secondary small py-2">Drag-and-drop layout editor requires Phase 6 implementation. Arrangement shown below is current saved layout.</div>
              <div id="layout-canvas"></div>
            </div>
          </div>
        </div>

        <!-- Layout Preview -->
        <div class="col-lg-3">
          <div class="card" style="height:auto">
            <div class="card-header py-2"><h6 class="mb-0 small">Layout Preview</h6></div>
            <div class="card-body" id="layout-preview"></div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/libs/global/global.min.js"></script>
<script src="assets/js/app/crm-dummy.js"></script>
<script src="assets/js/app/crm-api.js"></script>
<script>window.CRM_PAGE = 'object-builder';</script>
<script src="assets/js/app/crm-shell.js"></script>
<script src="assets/js/app/crm-components.js"></script>
<script src="assets/js/appSettings.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/app/crm-object-builder.js"></script>
<script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
