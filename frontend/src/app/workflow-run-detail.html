<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow Execution Detail — NexLink CRM</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
<div class="page-layout">
  <main class="app-wrapper">
    <div class="container-fluid">

      <div class="app-page-head d-flex align-items-center justify-content-between mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
            <li class="breadcrumb-item"><a href="app/workflow-analytics.html">Workflow Analytics</a></li>
            <li class="breadcrumb-item active" id="bc-exec-id">exec-001</li>
          </ol>
        </nav>
        <span class="badge bg-warning-subtle text-warning border border-warning-subtle">Cat 2 — Dummy Mode</span>
      </div>

      <!-- Identity Strip -->
      <div class="row mb-3">
        <div class="col-12">
          <div class="card mb-0" style="height:auto">
            <div class="card-body">
              <div class="d-flex flex-wrap align-items-center gap-3">
                <div class="flex-grow-1">
                  <div class="d-flex align-items-center gap-2 mb-1">
                    <h5 class="mb-0 fw-bold" id="exec-id">exec-001</h5>
                    <span id="exec-status-badge"></span>
                  </div>
                  <p class="mb-0 fw-semibold" id="exec-workflow-name">—</p>
                  <div class="d-flex gap-3 mt-1 small text-muted">
                    <span><i class="fi fi-rr-bolt me-1"></i>Trigger: <span id="exec-trigger">—</span></span>
                    <span><i class="fi fi-rr-time-check me-1"></i>Duration: <span id="exec-duration">—</span></span>
                    <span><i class="fi fi-rr-list me-1"></i>Steps: <span id="exec-steps">—</span></span>
                  </div>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-sm btn-outline-primary" id="btn-retry">Retry Execution</button>
                  <a href="app/workflow-builder.html" class="btn btn-sm btn-outline-secondary">View Workflow</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Split Pane -->
      <div class="row g-3">
        <div class="col-lg-8">
          <div class="card" style="height:auto">
            <div class="card-header">
              <ul class="nav nav-tabs card-header-tabs" id="exec-tabs">
                <li class="nav-item"><a class="nav-link active" href="#tab-log" data-bs-toggle="tab">Execution Log</a></li>
                <li class="nav-item"><a class="nav-link" href="#tab-steps" data-bs-toggle="tab">Steps</a></li>
                <li class="nav-item"><a class="nav-link" href="#tab-error" data-bs-toggle="tab">Error Details</a></li>
              </ul>
            </div>
            <div class="card-body tab-content">
              <div class="tab-pane fade show active" id="tab-log">
                <div id="exec-log-list"></div>
              </div>
              <div class="tab-pane fade" id="tab-steps">
                <div id="exec-steps-list"></div>
              </div>
              <div class="tab-pane fade" id="tab-error">
                <div id="exec-error-detail"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card mb-3" style="height:auto">
            <div class="card-header"><h6 class="mb-0">Execution Summary</h6></div>
            <div class="card-body" id="exec-summary"></div>
          </div>
          <div class="card" style="height:auto">
            <div class="card-header"><h6 class="mb-0">Retry Status</h6></div>
            <div class="card-body" id="exec-retry-status"></div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/libs/global/global.min.js"></script>
<script src="assets/js/app/crm-dummy.js"></script>
<script src="assets/js/app/crm-api.js"></script>
<script>window.CRM_PAGE = 'workflow-run-detail';</script>
<script src="assets/js/app/crm-shell.js"></script>
<script src="assets/js/app/crm-components.js"></script>
<script src="assets/js/appSettings.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/app/crm-workflow-run-detail.js"></script>
<script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
