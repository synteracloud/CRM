<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pakistan CRM — Organization Settings</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
  <div class="page-layout">
    <main class="app-wrapper">
      <div class="container-fluid pb-4">

        <div class="app-page-head">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
              <li class="breadcrumb-item">Settings</li>
              <li class="breadcrumb-item active">Organization</li>
            </ol>
          </nav>
        </div>

        <div class="row">
          <!-- Settings left nav -->
          <div class="col-lg-3 col-md-4 mb-3">
            <div class="card" style="height:auto">
              <div class="card-body p-2">
                <div class="list-group list-group-flush" id="settings-nav">
                  <a class="list-group-item list-group-item-action active d-flex align-items-center gap-2 py-2" href="app/org-settings.html"><i class="fi fi-rr-building"></i> Organization</a>
                  <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/user-management-crm.html"><i class="fi fi-rr-users"></i> Users</a>
                  <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/roles.html"><i class="fi fi-rr-shield-check"></i> Roles & Permissions</a>
                  <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/billing-settings.html"><i class="fi fi-rr-credit-card"></i> Billing</a>
                  <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/integrations.html"><i class="fi fi-rr-plug"></i> Integrations</a>
                  <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/notifications.html"><i class="fi fi-rr-bell"></i> Notifications</a>
                  <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/feature-flags.html"><i class="fi fi-rr-flag"></i> Feature Flags</a>
                  <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/compliance.html"><i class="fi fi-rr-document-signed"></i> Compliance</a>
                </div>
              </div>
            </div>
          </div>

          <!-- Content panel -->
          <div class="col-lg-9 col-md-8">
            <div class="card" style="height:auto">
              <div class="card-header d-flex align-items-center justify-content-between">
                <h6 class="card-title mb-0">Organization Settings</h6>
                <button type="button" class="btn btn-primary btn-sm waves-effect" id="btn-save-org">Save Changes</button>
              </div>
              <div class="card-body">

                <h6 class="text-muted small text-uppercase mb-3">Tenant Identity</h6>
                <div class="row g-3 mb-4">
                  <div class="col-sm-6">
                    <label class="form-label">Organization Name</label>
                    <input type="text" class="form-control" value="Pakistan CRM Demo Tenant" id="org-name">
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">Business Address</label>
                    <input type="text" class="form-control" value="24 Blue Area, Islamabad" id="org-address">
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">Logo</label>
                    <input type="file" class="form-control" accept="image/*">
                    <div class="form-text">PNG or SVG, max 200KB.</div>
                  </div>
                </div>

                <hr>
                <h6 class="text-muted small text-uppercase mb-3">Locale</h6>
                <div class="row g-3 mb-4">
                  <div class="col-sm-6">
                    <label class="form-label">Timezone</label>
                    <select class="form-select" id="org-timezone">
                      <option selected>UTC+5 — Pakistan Standard Time (PKT)</option>
                      <option>UTC+0 — Greenwich Mean Time</option>
                    </select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">Date Format</label>
                    <select class="form-select">
                      <option selected>DD/MM/YYYY</option>
                      <option>MM/DD/YYYY</option>
                      <option>YYYY-MM-DD</option>
                    </select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">Language Default</label>
                    <select class="form-select">
                      <option selected>English (EN)</option>
                      <option>اردو (UR) — requires P-017 sign-off</option>
                    </select>
                  </div>
                </div>

                <hr>
                <h6 class="text-muted small text-uppercase mb-3">Currency</h6>
                <div class="row g-3 mb-4">
                  <div class="col-sm-6">
                    <label class="form-label">Base Currency</label>
                    <select class="form-select"><option selected>PKR — Pakistani Rupee</option></select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">Notation</label>
                    <select class="form-select"><option selected>Lakh / Crore (enabled)</option><option>Standard</option></select>
                  </div>
                </div>

                <hr>
                <h6 class="text-muted small text-uppercase mb-3">Business Hours</h6>
                <div class="row g-3">
                  <div class="col-sm-4">
                    <label class="form-label">Open</label>
                    <input type="time" class="form-control" value="09:00">
                  </div>
                  <div class="col-sm-4">
                    <label class="form-label">Close</label>
                    <input type="time" class="form-control" value="19:00">
                  </div>
                  <div class="col-sm-4">
                    <label class="form-label">Working Days</label>
                    <input type="text" class="form-control" value="Monday – Saturday">
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
  <script src="assets/libs/global/global.min.js"></script>
  <script src="assets/js/app/crm-dummy.js"></script>
  <script src="assets/js/app/crm-api.js"></script>
  <script>window.CRM_PAGE = 'org-settings';</script>
  <script src="assets/js/app/crm-shell.js"></script>
  <script src="assets/js/app/crm-components.js"></script>
  <script src="assets/js/appSettings.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/app/crm-org-settings.js"></script>
  <script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
