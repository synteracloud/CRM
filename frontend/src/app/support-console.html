<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Console — NexLink CRM</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
<div class="page-layout">
  <main class="app-wrapper">
    <div class="container-fluid">

      <div class="app-page-head d-flex align-items-center justify-content-between mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
            <li class="breadcrumb-item active">Support Console</li>
          </ol>
        </nav>
        <div class="d-flex align-items-center gap-3">
          <!-- Active SLA Timer (always visible) -->
          <div class="d-flex align-items-center gap-2 bg-danger-subtle rounded px-3 py-1 border border-danger-subtle" id="global-sla-timer">
            <i class="fi fi-rr-alarm-clock text-danger"></i>
            <div>
              <div class="small text-danger fw-semibold">Active SLA Timer</div>
              <div class="fw-bold text-danger" id="sla-timer-display">—</div>
            </div>
          </div>
          <span class="badge bg-warning-subtle text-warning border border-warning-subtle">Cat 2 — Dummy Mode</span>
        </div>
      </div>

      <!-- 3-Pane Console Layout -->
      <div class="row g-3" style="min-height:600px">

        <!-- Left Pane: SLA Queue -->
        <div class="col-lg-3">
          <div class="card" style="height:auto">
            <div class="card-header d-flex align-items-center justify-content-between">
              <h6 class="mb-0">SLA Queue</h6>
              <span class="badge bg-danger" id="queue-count">—</span>
            </div>
            <div class="card-body p-0">
              <div class="list-group list-group-flush" id="sla-queue-list"></div>
            </div>
          </div>
        </div>

        <!-- Center Pane: Conversation Thread -->
        <div class="col-lg-5">
          <div class="card" style="height:auto">
            <div class="card-header d-flex align-items-center gap-2" id="thread-header">
              <span class="fw-semibold" id="thread-case-num">Select a case</span>
              <span id="thread-status-badge"></span>
            </div>
            <div class="card-body" id="thread-body" style="min-height:400px">
              <div class="text-center text-muted py-5">
                <i class="fi fi-rr-ticket fs-2 mb-2 d-block"></i>
                Select a case from the queue to view the conversation thread.
              </div>
            </div>
            <div class="card-footer" id="thread-compose" style="display:none">
              <textarea class="form-control form-control-sm mb-2" rows="2" placeholder="Type your reply..."></textarea>
              <div class="d-flex gap-2">
                <button class="btn btn-sm btn-primary">Send Reply</button>
                <button class="btn btn-sm btn-outline-secondary">Internal Note</button>
                <button class="btn btn-sm btn-outline-success ms-auto">Mark Resolved</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Pane: Customer Context + Escalation -->
        <div class="col-lg-4">
          <div class="card mb-3" style="height:auto">
            <div class="card-header"><h6 class="mb-0">Customer Context</h6></div>
            <div class="card-body" id="ctx-customer">
              <div class="text-muted small text-center py-3">No case selected.</div>
            </div>
          </div>
          <div class="card" style="height:auto">
            <div class="card-header"><h6 class="mb-0">Escalation Controls</h6></div>
            <div class="card-body" id="ctx-escalation">
              <div class="text-muted small text-center py-3">No case selected.</div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </main>
</div>

<script src="assets/libs/global/global.min.js"></script>
<script src="assets/js/app/crm-dummy.js"></script>
<script src="assets/js/app/crm-api.js"></script>
<script>window.CRM_PAGE = 'support-console';</script>
<script src="assets/js/app/crm-shell.js"></script>
<script src="assets/js/app/crm-components.js"></script>
<script src="assets/js/appSettings.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/app/crm-support-console.js"></script>
<script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
