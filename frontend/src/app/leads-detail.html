<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pakistan CRM — Lead Detail</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css?v=2">
</head>
<body>
  <div class="page-layout">
    <!-- header + sidebar injected by crm-shell.js -->
    <main class="app-wrapper">

      <div class="container-fluid">

        <div class="app-page-head d-flex align-items-center justify-content-between">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item">
                <a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a>
              </li>
              <li class="breadcrumb-item">
                <a href="app/leads.html">Lead Queue</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page" id="lead-breadcrumb">—</li>
            </ol>
          </nav>
          <a href="app/leads.html" class="btn btn-sm btn-white waves-effect btn-shadow">
            <i class="fi fi-rr-arrow-left me-1"></i> Back to Queue
          </a>
        </div>

        <!-- ── Lead identity strip ─────────────────────────────────────── -->
        <div class="row mb-3">
          <div class="col-12">
            <div class="card mb-0" style="height:auto">
              <div class="card-body py-3">
                <div class="d-flex flex-wrap align-items-center gap-3 justify-content-between">

                  <div class="d-flex align-items-center gap-3">
                    <div class="avatar avatar-lg rounded-circle">
                      <img src="assets/images/avatar/avatar1.webp" alt="Lead" id="lead-avatar-img">
                    </div>
                    <div>
                      <h4 class="mb-0 fw-bold" id="lead-name">—</h4>
                      <div class="d-flex flex-wrap gap-2 align-items-center mt-1">
                        <span class="text-muted small" id="lead-phone-label">
                          <i class="fi fi-rr-phone-call me-1"></i>—
                        </span>
                        <span id="lead-stage-badge"></span>
                        <span id="lead-source-badge"></span>
                        <span id="enforcement-badge"></span>
                      </div>
                    </div>
                  </div>

                  <div class="d-flex flex-wrap gap-2">
                    <button type="button" class="btn btn-sm btn-white waves-effect btn-shadow">
                      <i class="fi fi-rr-user-add me-1"></i>Assign
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-primary waves-effect">
                      <i class="fi fi-rr-calendar-plus me-1"></i>Schedule Follow-up
                    </button>
                    <button type="button" class="btn btn-sm btn-primary waves-effect">
                      <i class="fi fi-rr-arrow-right me-1"></i>Convert
                    </button>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── Split pane ─────────────────────────────────────────────── -->
        <div class="row">

          <!-- Context panel (left) -->
          <div class="col-lg-4 col-sm-12">
            <div class="row">

              <!-- Next Action card -->
              <div class="col-12">
                <div class="card border border-2" id="next-action-card">
                  <div class="card-header border-0 pb-0">
                    <div class="d-flex align-items-center gap-2">
                      <div class="avatar avatar-sm rounded-3" id="next-action-icon-wrap">
                        <i class="fi fi-rr-bolt"></i>
                      </div>
                      <h6 class="card-title mb-0" id="next-action-title">Next Action</h6>
                    </div>
                  </div>
                  <div class="card-body" id="next-action-body">
                    <!-- populated by crm-leads-detail.js -->
                  </div>
                </div>
              </div>

              <!-- Lead Info card -->
              <div class="col-12">
                <div class="card">
                  <div class="card-header border-0 pb-0">
                    <div class="d-flex justify-content-between align-items-center">
                      <h6 class="card-title mb-0">Lead Info</h6>
                      <button type="button" class="btn btn-white btn-sm btn-shadow btn-icon waves-effect">
                        <i class="fi fi-rr-pencil"></i>
                      </button>
                    </div>
                  </div>
                  <div class="card-body pt-2">
                    <div class="mb-3">
                      <span class="text-muted small">Full Name</span>
                      <p class="fw-semibold mb-0" id="info-full-name">—</p>
                    </div>
                    <div class="mb-3">
                      <span class="text-muted small">Phone</span>
                      <p class="fw-semibold mb-0" id="info-phone">—</p>
                    </div>
                    <div class="mb-3">
                      <span class="text-muted small">Source</span>
                      <p class="fw-semibold mb-0 text-capitalize" id="info-source">—</p>
                    </div>
                    <div class="mb-3">
                      <span class="text-muted small">Stage</span>
                      <p class="mb-0" id="info-stage-badge">—</p>
                    </div>
                    <div class="mb-3">
                      <span class="text-muted small">Owner</span>
                      <div class="d-flex align-items-center mt-1 gap-2">
                        <div class="avatar avatar-xxs rounded-circle">
                          <img src="assets/images/avatar/avatar1.webp" alt="" id="info-owner-avatar">
                        </div>
                        <span class="fw-semibold" id="info-owner-name">—</span>
                      </div>
                    </div>
                    <div class="mb-3">
                      <span class="text-muted small">Created</span>
                      <p class="fw-semibold mb-0" id="info-created-at">—</p>
                    </div>
                    <div class="mb-0">
                      <span class="text-muted small">Est. Value</span>
                      <p class="fw-semibold mb-0 text-primary" id="info-estimated-value">—</p>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Lead Score card — populated by crm-leads-detail.js -->
              <div class="col-12">
                <div class="card">
                  <div class="card-header border-0 pb-0">
                    <h6 class="card-title mb-0">Lead Score</h6>
                  </div>
                  <div class="card-body pt-2">
                    <div class="d-flex align-items-center gap-3 mb-2">
                      <h2 class="mb-0 fw-bold text-primary" id="lead-score-value">—</h2>
                      <div class="small text-muted">/ 100</div>
                      <span class="badge badge-sm" id="lead-score-band"></span>
                    </div>
                    <div class="progress progress-sm mb-3">
                      <div class="progress-bar bg-primary" id="lead-score-bar" style="width:0%"></div>
                    </div>
                    <div id="lead-score-drivers" class="small text-muted"></div>
                  </div>
                </div>
              </div>

            </div>
          </div>

          <!-- Main pane (right) -->
          <div class="col-lg-8 col-sm-12">
            <div class="card">
              <div class="card-header border-0 pb-0">
                <ul class="nav nav-tabs card-header-tabs" id="lead-detail-tabs" role="tablist">
                  <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-contact" data-bs-toggle="tab" data-bs-target="#pane-contact" type="button" role="tab">
                      <i class="fi fi-rr-user me-1"></i>Contact Info
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-pipeline" data-bs-toggle="tab" data-bs-target="#pane-pipeline" type="button" role="tab">
                      <i class="fi fi-rr-chart-histogram me-1"></i>Pipeline
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link position-relative" id="tab-followups" data-bs-toggle="tab" data-bs-target="#pane-followups" type="button" role="tab">
                      <i class="fi fi-rr-list-check me-1"></i>Follow-ups
                      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="followup-count-badge" style="font-size:0.6rem;display:none;"></span>
                    </button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-activity" data-bs-toggle="tab" data-bs-target="#pane-activity" type="button" role="tab">
                      <i class="fi fi-rr-clock me-1"></i>Activity
                    </button>
                  </li>
                </ul>
              </div>

              <div class="card-body">
                <div class="tab-content" id="lead-detail-tab-content">

                  <!-- ── Tab 1: Contact Info ── -->
                  <div class="tab-pane fade show active" id="pane-contact" role="tabpanel">
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label text-muted small">Full Name</label>
                        <input type="text" class="form-control" id="field-full-name" readonly>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label text-muted small">Phone (E.164)</label>
                        <input type="tel" class="form-control" id="field-phone" readonly>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label text-muted small">Email</label>
                        <input type="email" class="form-control" id="field-email" readonly>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label text-muted small">Source</label>
                        <input type="text" class="form-control text-capitalize" id="field-source" readonly>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label text-muted small">Priority</label>
                        <input type="text" class="form-control text-capitalize" id="field-priority" readonly>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label text-muted small">Est. Value (PKR)</label>
                        <input type="text" class="form-control" id="field-est-value" readonly>
                      </div>
                      <div class="col-12">
                        <label class="form-label text-muted small">Notes</label>
                        <textarea class="form-control" rows="3" placeholder="Add notes about this lead..."></textarea>
                      </div>
                      <div class="col-12 text-end">
                        <button type="button" class="btn btn-success btn-sm waves-effect">
                          <i class="fi fi-rr-check me-1"></i>Save Changes
                        </button>
                      </div>
                    </div>
                  </div>

                  <!-- ── Tab 2: Pipeline ── -->
                  <div class="tab-pane fade" id="pane-pipeline" role="tabpanel">
                    <h6 class="mb-3">Stage Progression</h6>

                    <div class="d-flex align-items-center gap-2 flex-wrap mb-4" id="stage-stepper">
                      <!-- populated by crm-leads-detail.js -->
                    </div>

                    <button type="button" class="btn btn-primary btn-sm waves-effect mb-4" id="btn-advance-stage">
                      <i class="fi fi-rr-arrow-right me-1"></i>Advance Stage
                    </button>

                    <h6 class="mb-2 mt-2">Stage Transition History</h6>
                    <div class="table-responsive">
                      <table class="table table-sm table-borderless">
                        <thead class="table-light">
                          <tr>
                            <th>Stage</th>
                            <th>Date</th>
                            <th>By</th>
                            <th>Duration</th>
                          </tr>
                        </thead>
                        <tbody id="stage-history-body">
                          <!-- populated by crm-leads-detail.js -->
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <!-- ── Tab 3: Follow-ups ── -->
                  <div class="tab-pane fade" id="pane-followups" role="tabpanel">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                      <h6 class="mb-0">Follow-up Tasks</h6>
                      <button type="button" class="btn btn-sm btn-outline-primary waves-effect">
                        <i class="fi fi-rr-plus me-1"></i>New Task
                      </button>
                    </div>
                    <div id="followup-tasks-list">
                      <!-- populated by crm-leads-detail.js -->
                    </div>
                  </div>

                  <!-- ── Tab 4: Activity Timeline ── -->
                  <div class="tab-pane fade" id="pane-activity" role="tabpanel">
                    <h6 class="mb-3">Activity Timeline</h6>
                    <div class="timeline-list" id="activity-timeline-list">
                      <!-- populated by crm-leads-detail.js -->
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </div>

        </div>

      </div>

    </main>
  </div>

  <!-- ── Script block ─────────────────────────────────────────────────── -->
  <script src="assets/libs/global/global.min.js"></script>
  <script src="assets/js/app/crm-dummy.js"></script>
  <script src="assets/js/app/crm-api.js"></script>
  <script>window.CRM_PAGE = 'leads-detail';</script>
  <script src="assets/js/app/crm-shell.js"></script>
  <script src="assets/js/app/crm-components.js"></script>
  <script src="assets/js/appSettings.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/app/crm-leads-detail.js"></script>
  <script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
