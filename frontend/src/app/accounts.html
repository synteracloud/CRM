<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pakistan CRM — Account List</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link rel="stylesheet" href="assets/libs/datatables/datatables.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
  <div class="page-layout">
    <main class="app-wrapper">
      <div class="container-fluid">

        <div class="app-page-head d-flex align-items-center justify-content-between">
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
              <li class="breadcrumb-item active">Accounts</li>
            </ol>
          </nav>
          <button type="button" class="btn btn-primary btn-sm waves-effect">
            <i class="fi fi-rr-building me-1"></i> New Account
          </button>
        </div>

        <!-- KPI cards -->
        <div class="row">
          <div class="col-xxl-3 col-md-6">
            <div class="card card-action action-border-primary">
              <div class="card-header border-0 pb-0"><div class="avatar bg-primary-subtle text-primary rounded-3"><i class="fi fi-rr-building"></i></div></div>
              <div class="card-body"><h6>Total Accounts</h6><h2 class="mb-1" id="kpi-total-accounts">—</h2><p class="mb-0 text-muted">All accounts</p></div>
            </div>
          </div>
          <div class="col-xxl-3 col-md-6">
            <div class="card card-action action-border-warning">
              <div class="card-header border-0 pb-0"><div class="avatar bg-warning-subtle text-warning rounded-3"><i class="fi fi-rr-star"></i></div></div>
              <div class="card-body"><h6>Enterprise</h6><h2 class="mb-1" id="kpi-enterprise">—</h2><p class="mb-0 text-muted">Enterprise tier</p></div>
            </div>
          </div>
          <div class="col-xxl-3 col-md-6">
            <div class="card card-action action-border-danger">
              <div class="card-header border-0 pb-0"><div class="avatar bg-danger-subtle text-danger rounded-3"><i class="fi fi-rr-time-past"></i></div></div>
              <div class="card-body"><h6>Outstanding</h6><h2 class="mb-1" id="kpi-outstanding">—</h2><p class="mb-0 text-muted">Total balance (PKR)</p></div>
            </div>
          </div>
          <div class="col-xxl-3 col-md-6">
            <div class="card card-action action-border-success">
              <div class="card-header border-0 pb-0"><div class="avatar bg-success-subtle text-success rounded-3"><i class="fi fi-rr-chart-pie-alt"></i></div></div>
              <div class="card-body"><h6>Open Opportunities</h6><h2 class="mb-1" id="kpi-open-opps">—</h2><p class="mb-0 text-muted">Active deals</p></div>
            </div>
          </div>
        </div>

        <!-- Account List DataTable -->
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-header d-flex align-items-center justify-content-between">
                <h6 class="card-title mb-0">Account List</h6>
                <div id="dt_Accounts_Search"></div>
              </div>
              <div class="px-3 py-2 border-bottom d-flex flex-wrap align-items-center gap-2">
                <span class="text-muted small me-1">Tier:</span>
                <ul class="nav nav-pills nav-pills-custom p-1 bg-light rounded-5" id="acc-filter-tier" role="tablist">
                  <li class="nav-item"><button type="button" class="nav-link rounded-5 active" data-filter="">All</button></li>
                  <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="Enterprise">Enterprise</button></li>
                  <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="Mid-Market">Mid-Market</button></li>
                  <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="SMB">SMB</button></li>
                </ul>
                <div class="vr mx-1"></div>
                <span class="text-muted small me-1">Balance:</span>
                <ul class="nav nav-pills nav-pills-custom p-1 bg-light rounded-5" id="acc-filter-balance" role="tablist">
                  <li class="nav-item"><button type="button" class="nav-link rounded-5 active" data-filter="">All</button></li>
                  <li class="nav-item"><button type="button" class="nav-link rounded-5" data-filter="overdue">Has Balance</button></li>
                </ul>
              </div>
              <div class="card-body px-1 pt-2 pb-2">
                <div class="table-responsive">
                  <table id="dt_Accounts" class="table table-sm display table-row-rounded">
                    <thead class="table-light">
                      <tr>
                        <th class="dt-head-center">Account</th>
                        <th class="dt-head-center">Tier</th>
                        <th class="dt-head-center">Industry</th>
                        <th class="dt-head-center">City</th>
                        <th class="dt-head-center">Open Opps</th>
                        <th class="dt-head-center">Outstanding (PKR)</th>
                        <th class="dt-head-center">Actions</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
  <script src="assets/libs/global/global.min.js"></script>
  <script src="assets/js/app/crm-dummy.js"></script>
  <script src="assets/js/app/crm-api.js"></script>
  <script>window.CRM_PAGE = 'accounts';</script>
  <script src="assets/js/app/crm-shell.js"></script>
  <script src="assets/js/app/crm-components.js"></script>
  <script src="assets/js/appSettings.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/libs/datatables/datatables.min.js"></script>
  <script src="assets/js/app/crm-accounts.js"></script>
  <script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
