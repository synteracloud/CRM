  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">

  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
  <div class="page-layout">
    <main class="app-wrapper">
      <div class="container-fluid pb-4">
        <div class="app-page-head">
          <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
            <li class="breadcrumb-item">Settings</li>
            <li class="breadcrumb-item active">Integrations</li>
          </ol></nav>
        </div>
        <div class="row">
          <div class="col-lg-3 col-md-4 mb-3">
            <div class="card" style="height:auto"><div class="card-body p-2"><div class="list-group list-group-flush">
              <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/org-settings.html"><i class="fi fi-rr-building"></i> Organization</a>
              <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/user-management-crm.html"><i class="fi fi-rr-users"></i> Users</a>
              <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/roles.html"><i class="fi fi-rr-shield-check"></i> Roles & Permissions</a>
              <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/billing-settings.html"><i class="fi fi-rr-credit-card"></i> Billing</a>
              <a class="list-group-item list-group-item-action active d-flex align-items-center gap-2 py-2" href="app/integrations.html"><i class="fi fi-rr-plug"></i> Integrations</a>
              <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/notifications.html"><i class="fi fi-rr-bell"></i> Notifications</a>
              <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/feature-flags.html"><i class="fi fi-rr-flag"></i> Feature Flags</a>
              <a class="list-group-item list-group-item-action d-flex align-items-center gap-2 py-2" href="app/compliance.html"><i class="fi fi-rr-document-signed"></i> Compliance</a>
            </div></div></div>
          </div>
          <div class="col-lg-9 col-md-8">
            <!-- WhatsApp -->
            <div class="card mb-3" style="height:auto">
              <div class="card-header d-flex align-items-center justify-content-between">
                <h6 class="card-title mb-0"><i class="fi fi-brands-whatsapp text-success me-2"></i>WhatsApp Provider</h6>
                <span class="badge bg-success-subtle text-success">Connected</span>
              </div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label">Provider</label>
                    <select class="form-select"><option selected>360dialog</option><option>Gupshup</option><option>Meta (Direct)</option><option>Twilio</option></select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">API Key</label>
                    <div class="input-group">
                      <input type="password" class="form-control" value="••••••••••••••••" readonly>
                      <button class="btn btn-outline-secondary btn-sm">Rotate</button>
                    </div>
                    <div class="form-text">Credentials never displayed after save — masked last-4 only.</div>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">Webhook Verification Secret</label>
                    <div class="input-group">
                      <input type="password" class="form-control" value="••••••••••••••••" readonly>
                      <button class="btn btn-outline-secondary btn-sm">Rotate</button>
                    </div>
                  </div>
                  <div class="col-12">
                    <button class="btn btn-sm btn-outline-primary waves-effect me-2">Test Connection</button>
                    <button class="btn btn-sm btn-primary waves-effect">Save WhatsApp Config</button>
                  </div>
                </div>
              </div>
            </div>
            <!-- Email -->
            <div class="card mb-3" style="height:auto">
              <div class="card-header d-flex align-items-center justify-content-between">
                <h6 class="card-title mb-0"><i class="fi fi-rr-envelope text-primary me-2"></i>Email</h6>
                <span class="badge bg-secondary-subtle text-secondary">Not configured</span>
              </div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label">Provider</label>
                    <select class="form-select"><option>— Select provider —</option><option>SendGrid</option><option>Amazon SES</option><option>SMTP</option></select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">From Address</label>
                    <input type="email" class="form-control" placeholder="noreply@yourdomain.com">
                  </div>
                  <div class="col-12"><button class="btn btn-sm btn-primary waves-effect">Save Email Config</button></div>
                </div>
              </div>
            </div>
            <!-- Notification channels -->
            <div class="card" style="height:auto">
              <div class="card-header"><h6 class="card-title mb-0">Notification Channels</h6></div>
              <div class="card-body">
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label">SMS Provider</label>
                    <select class="form-select"><option>— Not configured —</option><option>Twilio SMS</option><option>Telenor Pakistan</option></select>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label">Push Notifications</label>
                    <select class="form-select"><option>— Not configured —</option><option>Firebase FCM</option></select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="assets/libs/global/global.min.js"></script>
  <script src="assets/js/app/crm-dummy.js"></script>
  <script src="assets/js/app/crm-api.js"></script>
  <script>window.CRM_PAGE = 'integrations';</script>
  <script src="assets/js/app/crm-shell.js"></script>
  <script src="assets/js/app/crm-components.js"></script>
  <script src="assets/js/appSettings.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/app/crm-integrations.js"></script>
  <script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
