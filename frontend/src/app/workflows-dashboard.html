<!DOCTYPE html>
<html lang="en">
<head>
  <base href="../">
  <meta charset="utf-8">
  <meta name="theme-color" content="#5955D1">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow Automation Dashboard — NexLink CRM</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/flaticon/css/all/all.css">
  <link rel="stylesheet" href="assets/libs/lucide/lucide.css">
  <link rel="stylesheet" href="assets/libs/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/libs/simplebar/simplebar.css">
  <link rel="stylesheet" href="assets/libs/node-waves/waves.css">
  <link rel="stylesheet" href="assets/libs/bootstrap-select/css/bootstrap-select.min.css">
  <link id="main-stylesheet" rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/crm-custom.css">
</head>
<body>
<div class="page-layout">
  <main class="app-wrapper">
    <div class="container-fluid">

      <div class="app-page-head d-flex align-items-center justify-content-between mb-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="app/dashboard.html"><i class="fi fi-rr-home"></i> Home</a></li>
            <li class="breadcrumb-item active">Workflow Dashboard</li>
          </ol>
        </nav>
        <div class="d-flex gap-2">
          <a href="app/workflow-builder.html" class="btn btn-sm btn-primary">
            <i class="fi fi-rr-plus me-1"></i>New Workflow
          </a>
          <span class="badge bg-warning-subtle text-warning border border-warning-subtle">Cat 2 — Dummy Mode</span>
        </div>
      </div>

      <!-- ZONE 1: Posture Strip -->
      <div class="row mb-3" id="posture-row" style="display:none">
        <div class="col-12">
          <div class="alert alert-danger d-flex align-items-center gap-3 mb-0 py-2">
            <i class="fi fi-rr-triangle-warning fs-5"></i>
            <span id="posture-text"></span>
          </div>
        </div>
      </div>

      <!-- ZONE 2: KPI Tiles -->
      <div class="row g-3 mb-3">
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-primary-subtle">
                  <i class="fi fi-rr-workflow text-primary"></i>
                </div>
                <div>
                  <h6 class="mb-0 text-muted small">Executions (Today)</h6>
                  <h2 class="mb-0 fw-bold" id="kpi-volume">—</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-success-subtle">
                  <i class="fi fi-rr-check text-success"></i>
                </div>
                <div>
                  <h6 class="mb-0 text-muted small">Success Rate</h6>
                  <h2 class="mb-0 fw-bold" id="kpi-success">—</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-warning-subtle">
                  <i class="fi fi-rr-refresh text-warning"></i>
                </div>
                <div>
                  <h6 class="mb-0 text-muted small">Retry Queue Depth</h6>
                  <h2 class="mb-0 fw-bold" id="kpi-retry">—</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-xl-3 col-sm-6">
          <div class="card" style="height:auto">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3">
                <div class="flex-shrink-0 avatar avatar-sm rounded bg-danger-subtle">
                  <i class="fi fi-rr-x text-danger"></i>
                </div>
                <div>
                  <h6 class="mb-0 text-muted small">Failed Executions</h6>
                  <h2 class="mb-0 fw-bold" id="kpi-failed">—</h2>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ZONE 3: Retry Backlog + Trend Chart -->
      <div class="row g-3 mb-3">
        <div class="col-lg-5">
          <div class="card" style="height:auto">
            <div class="card-header d-flex align-items-center justify-content-between">
              <h6 class="mb-0">Failed / Retrying Executions</h6>
              <a href="app/workflow-analytics.html" class="btn btn-sm btn-outline-primary">Analytics</a>
            </div>
            <div class="card-body p-0">
              <div class="list-group list-group-flush" id="retry-queue"></div>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="card" style="height:auto">
            <div class="card-header">
              <h6 class="mb-0">Execution Pass / Fail (Last 5 Days)</h6>
            </div>
            <div class="card-body">
              <div id="chart-workflow-trend"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="assets/libs/global/global.min.js"></script>
<script src="assets/js/app/crm-dummy.js"></script>
<script src="assets/js/app/crm-api.js"></script>
<script>window.CRM_PAGE = 'workflows-dashboard';</script>
<script src="assets/js/app/crm-shell.js"></script>
<script src="assets/js/app/crm-components.js"></script>
<script src="assets/js/appSettings.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/libs/apexcharts/apexcharts.min.js"></script>
<script src="assets/js/app/crm-workflows-dashboard.js"></script>
<script src="assets/js/app/crm-locale.js"></script>
</body>
</html>
