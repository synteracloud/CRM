[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    ".venv",
    "__pycache__",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "TID"]
ignore = ["E501"]

# E-005: Prevent core/ from importing pakistan adapters directly.
# Only adapters/pakistan/ may use the pakistan adapter implementations.
# All other modules must go through adapters/interfaces/.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"adapters.pakistan" = {msg = "core/ must not import adapters.pakistan — use adapters.interfaces instead (ADR-002)"}

[tool.ruff.lint.per-file-ignores]
# Pakistan adapter layer is allowed to import itself
"adapters/pakistan/**" = ["TID251"]
# Tests may import any module for assertion purposes
"tests/**" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["services", "adapters"]
